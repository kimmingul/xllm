name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Smoke (dry-run only — no live LLMs; safe on bare runners)
        run: npm run smoke

      - name: Bench grader selftest (deterministic, no LLMs)
        run: npm run bench:selftest

      - name: Doctor (no live LLMs required)
        run: node scripts/xllm-advisor.js --doctor
        continue-on-error: true

      - name: Plugin manifest sanity
        run: node scripts/check-plugin.mjs
